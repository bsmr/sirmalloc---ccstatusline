version: 2

project_name: ccstatusline

builds:
  - id: ccstatusline
    binary: ccstatusline
    main: ./cmd/ccstatusline
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: ccstatusline-setup
    binary: ccstatusline-setup
    main: ./cmd/ccstatusline-setup
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: true

snapshot:
  version_template: "{{ .Tag }}-next"
